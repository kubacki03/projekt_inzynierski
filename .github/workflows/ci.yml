name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projekt_inzynierski.client/package-lock.json

      - name: Restore
        run: dotnet restore Tests/Tests.csproj

      - name: Build
        run: dotnet build Tests/Tests.csproj --no-restore --configuration Release
        
      - name: Test (unit tests only)
        run: >
          dotnet test Tests/Tests.csproj --no-build --configuration Release
          --filter "FullyQualifiedName!~IntegrationTests"
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Tests/TestResults/**

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projekt_inzynierski.client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projekt_inzynierski.client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
